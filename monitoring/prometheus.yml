# Step 52 — scrape config for the host-run app. Prometheus runs in Docker,
# so `host.docker.internal` reaches the app on the developer machine.
# Override the target with APP_METRICS_URL env when the app uses another host/port.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: phantom-permission-mcp
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: /metrics
